name: Tests

# Runs the end-to-end checks on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild index.html from server.py (the sync workflow commits it on main)
        run: python3 build_standalone.py
      - name: Check extraction, workbook filling, and that the browser, Colab and Python versions offer the same options
        run: python3 tests/test_tool.py
